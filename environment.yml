# Conda environment for the benchmark and local analysis notebooks.
# The benchmark runtime uses Python, psutil, PyYAML, and requests; the remaining
# packages support interactive analysis and plotting.
name: '291'
channels:
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
  - defaults
dependencies:
  - python=3.12.15
  - psutil=7.2.2
  - pyyaml
  - requests
  - pandas=3.0.6
  - jupyter
  - nbclassic
  - matplotlib
  - aiohttp
